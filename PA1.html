
<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        h1 {
            color: steelblue;
        }

        table {
            margin: auto;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 10px;
        }

        img {
            width: 200px;
            height: 120px;
        }
    </style>
</head>

<body>

    <h1>Tourist Places in India</h1>

    <table>
        <tr>
            <td>
                <img src="img1.jpg" alt="India Gate">
                <br>India Gate
            </td>

            <td>
                <img src="img2.jpg" alt="Red Fort">
                <br>Red Fort
            </td>
        </tr>

        <tr>
            <td>
                <img src="img3.jpg" alt="Qutub Minar">
                <br>Qutub Minar
            </td>

            <td>
                <img src="img4.jpg" alt="Lotus Temple">
                <br>Lotus Temple
            </td>
        </tr>
    </table>

</body>
</html>
